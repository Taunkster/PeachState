[project]
name = "peachstate-coolchain"
version = "0.1.0"
description = "Georgia thermal management from field to Port of Savannah — powered by FortyGuard Temperature API"
requires-python = ">=3.11"
dependencies = [
    # SDK core
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "shapely>=2.0",
    "networkx>=3.3",
    "pyproj>=3.6",       # CRS transforms (EPSG:4326 -> UTM 16N/17N for GA)
    "numpy>=1.26",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "tenacity>=8.3",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
    # background scheduler (Day 4: `fg serve` separate process)
    "apscheduler>=3.10",
    # API / dashboard
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.37",
    "leafmap>=0.30",
    "geopandas>=0.14",
    "osmnx>=1.9",        # road network graphs
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx-mock>=0.2"]
routing = ["osmnx>=1.9", "pyproj>=3.6"]
premium = ["rasterio>=1.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fortyguard_sdk*", "coolchain*"]

[project.scripts]
fg = "coolchain.cli.commands:main"